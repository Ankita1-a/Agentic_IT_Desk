[pytest]
# Explicitly scoped to the automated suite. Without this, pytest's default
# discovery (any *_test.py / test_*.py file) also sweeps up smoke_test.py
# and test_classifier.py — both are manual, live-API diagnostic scripts
# (run directly with `python smoke_test.py`), not part of the automated
# regression suite, and must never run unattended in CI.
testpaths = test_main.py
